name: USBODE CI Build

permissions:
  contents: write

on:
  push:
    branches: [ "*" ]
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "version.txt"
      - "docs/**"
  workflow_dispatch:
    branches: [ "main" ]

env:
  # Run every JavaScript action on Node 24, including any that still declare
  # an older runtime in their action.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Arm GNU Toolchain version for the 32-bit (arm-none-eabi) and 64-bit
  # (aarch64-none-elf) builds; each build leg installs only its own.
  # Bumping this invalidates the toolchain caches.
  ARM_TOOLCHAIN_VERSION: 14.3.rel1

jobs:
  # Gate the build on the host regression tests: they run in a couple of
  # minutes, so there is no point spending a full multi-arch build on a
  # commit they already reject.
  # Shared with the standalone host-tests workflow rather than duplicated,
  # so the two can never drift apart.
  host-tests:
    uses: ./.github/workflows/host-tests.yml

  # The 32-bit and 64-bit halves build in parallel on separate runners, each
  # with only its own toolchain. Everything that needs both halves (the
  # rpi-imager OS list and the release bundle) happens in `assemble`.
  build:
    needs: host-tests
    runs-on: ubuntu-26.04
    strategy:
      # One half failing makes the run useless for release anyway, but let
      # the other half finish so both sets of errors show up in one run.
      fail-fast: false
      matrix:
        include:
          - preset: 32bit
            arch: "32"
            dist: dist
            toolchain: arm-none-eabi
            suffix: ""
          - preset: 64bit
            arch: "64"
            dist: dist64
            toolchain: aarch64-none-elf
            suffix: "-64bit"
    name: build (${{ matrix.preset }})
    outputs:
      # Identical in both legs: the 32-bit zip name without .zip.
      filename: ${{ steps.get-filename.outputs.filename }}
      commit_hash: ${{ steps.get-commit.outputs.commit_hash }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules:  recursive
        clean: true

    # Host packages that were previously preinstalled on the self-hosted
    # agent (see BUILD.md "Linux Build Requirements"):
    #   texinfo/texi2html - circle-stdlib's newlib build
    #   mame-tools        - chdman, converts the bundled audio-test CHD
    #   libarchive-zip-perl - crc32 for the sysupgrade package
    #   exfatprogs/dosfstools/fdisk - scripts/create-img.sh (disk images)
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential texinfo texi2html zip unzip wget xz-utils \
          mame-tools libarchive-zip-perl \
          exfatprogs dosfstools fdisk mtools python3

    - name: Cache Arm GNU Toolchain (${{ matrix.toolchain }})
      id: toolchain-cache
      uses: actions/cache@v5
      with:
        path: ~/arm-toolchain/${{ matrix.toolchain }}
        key: arm-gnu-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ env.ARM_TOOLCHAIN_VERSION }}

    - name: Download Arm GNU Toolchain (${{ matrix.toolchain }})
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      env:
        TARGET: ${{ matrix.toolchain }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64)        host=x86_64 ;;
          aarch64|arm64) host=aarch64 ;;
          *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
        esac
        name="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-${host}-${TARGET}"
        mkdir -p ~/arm-toolchain
        curl -fsSL --retry 3 --retry-delay 10 -o "/tmp/${name}.tar.xz" \
          "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/${name}.tar.xz"
        tar -xJf "/tmp/${name}.tar.xz" -C ~/arm-toolchain
        mv ~/arm-toolchain/"${name}" ~/arm-toolchain/"${TARGET}"
        rm -f "/tmp/${name}.tar.xz"

    # The Makefile reads its toolchain prefixes and target list from
    # ~/build-usbode.conf. These targets match what the self-hosted agent
    # shipped: 32-bit kernel/kernel7/kernel8-32/kernel7l, 64-bit
    # kernel8/kernel8-rpi4. Each leg only has its own toolchain installed;
    # the other prefix is never used by that leg's targets.
    - name: Write build-usbode.conf
      run: |
        cat > "$HOME/build-usbode.conf" <<EOF
        supported_rasppi=(1 2 3 4)
        supported_rasppi_64=(3 4)
        PathPrefix=$HOME/arm-toolchain/arm-none-eabi/bin/arm-none-eabi-
        PathPrefix64=$HOME/arm-toolchain/aarch64-none-elf/bin/aarch64-none-elf-
        EOF
        cat "$HOME/build-usbode.conf"
        "$HOME/arm-toolchain/${{ matrix.toolchain }}/bin/${{ matrix.toolchain }}-gcc" --version | head -n1

    # circle-deps / boot download these from GitHub on every fresh checkout.
    # Unauthenticated raw-file fetches to RPi-Distro/firmware-nonfree can hit
    # GitHub's rate limit (HTTP 429) and fail the whole build. Cache them
    # across runs; the key is derived from the pinned firmware commit hash in
    # each Makefile, so bumping either
    # FIRMWARE variable upstream automatically invalidates the cache instead
    # of silently keeping stale blobs.
    - name: Cache WLAN firmware
      uses: actions/cache@v5
      with:
        path: circle-stdlib/libs/circle/addon/wlan/firmware
        key: wlan-firmware-${{ hashFiles('circle-stdlib/libs/circle/addon/wlan/firmware/Makefile') }}

    - name: Cache boot firmware
      uses: actions/cache@v5
      with:
        # Only the files boot/Makefile downloads, never the tracked
        # sources (Makefile, armstub/*, config*.txt) that ship in the
        # circle submodule itself, so a cache restore can never shadow a
        # newer tracked file with a stale cached one.
        path: |
          circle-stdlib/libs/circle/boot/LICENCE.broadcom
          circle-stdlib/libs/circle/boot/COPYING.linux
          circle-stdlib/libs/circle/boot/bootcode.bin
          circle-stdlib/libs/circle/boot/start*.elf
          circle-stdlib/libs/circle/boot/fixup*.dat
          circle-stdlib/libs/circle/boot/*.dtb
          circle-stdlib/libs/circle/boot/*.dtbo
        key: boot-firmware-${{ hashFiles('circle-stdlib/libs/circle/boot/Makefile') }}

    # A restored cache or an earlier failed download can contain 0-byte
    # firmware files: wget -O creates the destination before the transfer
    # starts, and the circle boot Makefile's download loop ignores per-file
    # wget failures. Build-947 "succeeded" that way while shipping 0-byte
    # bootcode.bin/fixup.dat — which bricks Pi Zero (2) W cards — and the
    # poisoned files were then saved into the cache. Delete any empty files
    # so the prefetch step / make re-download them instead.
    - name: Purge empty firmware files (cache poison guard)
      run: |
        find circle-stdlib/libs/circle/addon/wlan/firmware \
             circle-stdlib/libs/circle/boot \
             -maxdepth 1 -type f -size 0 -print -delete

    # When the caches above miss, fetch the same files through api.github.com
    # with the workflow token instead of letting make wget them anonymously:
    # authenticated requests use a per-token quota (1000 req/h) that is not
    # affected by the anonymous per-IP throttle that rate-limited the runner
    # (HTTP 429 -> wget "Error 8" -> silent 0-byte files, see above). The file
    # lists and pinned refs are parsed from the two Makefiles at run time, so
    # a FIRMWARE pin bump upstream is picked up automatically. Non-fatal: if
    # this step fails, make falls back to its own wget exactly as before.
    #
    # Each file is fetched only if missing or empty, and every download goes
    # to a temp file that is moved into place only when non-empty, so a failed
    # transfer can never leave a 0-byte file for make to treat as done.
    - name: Prefetch firmware via GitHub API (on cache miss)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -uo pipefail
        fetch() { # $1 owner/repo  $2 ref  $3 path-in-repo  $4 dest-file
          local tmp="$4.fetch-tmp"
          if curl -sSfL --retry 3 --retry-delay 10 \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github.raw" \
               "https://api.github.com/repos/$1/contents/$3?ref=$2" -o "$tmp" \
             && [ -s "$tmp" ]; then
            mv "$tmp" "$4"
          else
            rm -f "$tmp"
            echo "prefetch FAILED for $3"
            return 1
          fi
        }

        rc=0

        FW=circle-stdlib/libs/circle/addon/wlan/firmware
        SHA=$(sed -n 's/^FIRMWARE ?= *//p' "$FW/Makefile")
        while read -r _ _ _ dest url; do
          [ -s "$FW/$dest" ] && continue
          fetch RPi-Distro/firmware-nonfree "$SHA" \
                "debian/config/brcm80211/${url#'$(BASEURL)/'}" "$FW/$dest" || rc=1
        done < <(grep -E '^[[:space:]]*wget -q -O ' "$FW/Makefile")

        BOOT=circle-stdlib/libs/circle/boot
        SHA=$(make -pn -C "$BOOT" 2>/dev/null | sed -n 's/^FIRMWARE = //p' | tail -n1)
        FILES=$(make -pn -C "$BOOT" 2>/dev/null | sed -n 's/^FILES = //p' | tail -n1)
        OVERLAYS=$(make -pn -C "$BOOT" 2>/dev/null | sed -n 's/^OVERLAYS = //p' | tail -n1)
        for f in $FILES; do
          [ -s "$BOOT/$f" ] || fetch raspberrypi/firmware "$SHA" "boot/$f" "$BOOT/$f" || rc=1
        done
        for f in $OVERLAYS; do
          [ -s "$BOOT/$f" ] || fetch raspberrypi/firmware "$SHA" "boot/overlays/$f" "$BOOT/$f" || rc=1
        done

        exit $rc

    # `make release-NN` is one architecture's half of `make release`:
    # kernels, zip and disk image. The image step runs scripts/create-img.sh,
    # which needs loop devices plus sudo for losetup/mount/mkfs; GitHub-hosted
    # Ubuntu runners grant passwordless sudo, so no sudoers setup is needed.
    - name: Build (${{ matrix.preset }})
      run: make release-${{ matrix.arch }} BUILD_NUMBER=${{ github.run_number }}

    # Refuse to ship a build containing empty files. A verified-good build
    # has none (checked against a local clean build), and empty boot firmware
    # looks like a successful build while bricking every Pi Zero (2) W card
    # it is flashed or sysupgraded onto (build-947, build-950).
    - name: Verify no empty files in distribution
      env:
        DIST: ${{ matrix.dist }}
      run: |
        bad=$(find "$DIST" -type f -size 0)
        if [ -n "$bad" ]; then
          echo "ERROR: empty files in distribution:"
          echo "$bad"
          exit 1
        fi
        for f in bootcode.bin fixup.dat start.elf; do
          if [ ! -s "$DIST/$f" ]; then
            echo "ERROR: missing or empty critical boot file: $DIST/$f"
            exit 1
          fi
        done
        echo "All distribution files verified non-empty"

    # Hand the freshly built dist tree (plus this leg's buildinfo.json,
    # which the boot-log validator derives its version expectations from) to
    # the matching qemu-boot-test job. Uploaded BEFORE "Clean Images Folder"
    # strips config.txt/cmdline.txt/images out of dist, because the boot test
    # needs the full tree a user's SD card would carry.
    - name: Publish QEMU boot-test input
      uses: actions/upload-artifact@v7
      with:
        name: qemu-boot-input-${{ matrix.preset }}
        path: |
          ${{ matrix.dist }}
          buildinfo.json
        if-no-files-found: error
        retention-days: 7

    - name: Get filename
      id: get-filename
      run: |
        FILENAME_FULL=$(ls usbode-*.zip | xargs basename)
        FILENAME=${FILENAME_FULL%.zip}
        FILENAME=${FILENAME%-64bit}
        echo "Found file: $FILENAME"
        echo "filename=$FILENAME" >> $GITHUB_OUTPUT

    - name: Get commit hash
      id: get-commit
      run: |
        echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.get-filename.outputs.filename }}-images${{ matrix.suffix }} IMG
        path: imgout/${{ steps.get-filename.outputs.filename }}${{ matrix.suffix }}.img.xz
        if-no-files-found: error
        retention-days: 90
        compression-level: 6
        overwrite: true
        include-hidden-files: false

    - name: Clean Images Folder
      run: make clean-imagesfolder

    - uses: actions/upload-artifact@v7
      with:
        # Using the extracted filename as the artifact name
        name: ${{ steps.get-filename.outputs.filename }}${{ matrix.suffix }}
        path: ${{ matrix.dist }}/*
        if-no-files-found: error
        retention-days: 90
        compression-level: 6
        overwrite: true
        include-hidden-files: false

    - name: Create upgrade package
      env:
        DIST: ${{ matrix.dist }}
        UPGRADE: sysupgrade${{ matrix.arch }}
      run: |
        mkdir -p upgrade
        cp buildinfo.json "$DIST/"
        (cd "$DIST" && tar -cf "../upgrade/$UPGRADE.tar" *)
        (cd upgrade && crc32 "$UPGRADE.tar" > "$UPGRADE.crc")

    - uses: actions/upload-artifact@v7
      with:
        name: sysupgrade${{ matrix.arch }}
        path: upgrade/sysupgrade${{ matrix.arch }}.tar
        if-no-files-found: error
        retention-days: 90
        compression-level: 6
        overwrite: true
        include-hidden-files: false

    - uses: actions/upload-artifact@v7
      with:
        name: sysupgrade${{ matrix.arch }}crc
        path: upgrade/sysupgrade${{ matrix.arch }}.crc
        if-no-files-found: error
        retention-days: 90
        compression-level: 6
        overwrite: true

    # This leg's share of the release, merged by the assemble job.
    - name: Publish release file half
      uses: actions/upload-artifact@v7
      with:
        name: release-files-${{ matrix.preset }}
        path: |
          usbode-*.zip
          imgout/*.img.xz
          upgrade/sysupgrade${{ matrix.arch }}.tar
          upgrade/sysupgrade${{ matrix.arch }}.crc
          buildinfo.json
        if-no-files-found: error
        retention-days: 7

  # Joins the two build halves: generates the rpi-imager OS list (it needs
  # both images) and bundles everything the release job publishes. Cheap -
  # no toolchains, no submodules.
  assemble:
    needs: build
    runs-on: ubuntu-26.04

    steps:
    # Scripts and the os-sublist template only. The branch/commit in the
    # image names come from this checkout, the same commit the builds used.
    - uses: actions/checkout@v6

    - name: Download 64-bit half
      uses: actions/download-artifact@v7
      with:
        name: release-files-64bit
        path: .

    - name: Download 32-bit half
      uses: actions/download-artifact@v7
      with:
        name: release-files-32bit
        path: half32

    # The release keeps the 64-bit leg's buildinfo.json, exactly as the
    # single-job build did (its 64-bit pass ran generate-buildinfo last).
    # Each sysupgrade tar carries its own leg's copy.
    - name: Merge halves
      run: |
        set -euo pipefail
        cp half32/usbode-*.zip .
        cp half32/imgout/*.img.xz imgout/
        cp half32/upgrade/* upgrade/
        rm -rf half32
        ls -l usbode-*.zip imgout upgrade buildinfo.json

    # The rpi-imager OS list, filled in from the two images built above.
    # Published as a release asset so that
    # https://github.com/danifunker/usbode-circle/releases/latest/download/os-sublist.json
    # can be handed to rpi-imager --repo directly.
    - name: Generate os-sublist.json
      run: make os-sublist BUILD_NUMBER=${{ github.run_number }}

    - uses: actions/upload-artifact@v7
      with:
        name: os-sublist
        path: imgout/os-sublist.json
        if-no-files-found: error
        retention-days: 90
        compression-level: 6
        overwrite: true

    # Everything the release job publishes, bundled once. The release job
    # consumes only this artifact.
    - name: Publish release file bundle
      uses: actions/upload-artifact@v7
      with:
        name: release-files
        path: |
          usbode-*.zip
          imgout/*.img.xz
          imgout/os-sublist.json
          upgrade/sysupgrade32.tar
          upgrade/sysupgrade32.crc
          upgrade/sysupgrade64.tar
          upgrade/sysupgrade64.crc
          buildinfo.json
        if-no-files-found: error
        retention-days: 7

  # Boot the kernels that build just produced under QEMU, on a virgin 1 GiB
  # card: USBODE's own first-boot setup must resize/format the card, reboot,
  # and come up as an ejected empty drive, and the whole boot log is
  # validated against this exact build's version (tests/qemu-boot/ - the
  # same script developers can run locally, see `make qemu-boot-test`).
  # fail-fast is off so a 32-bit failure still reports the 64-bit result;
  # the two legs run in parallel on separate GitHub-hosted runners.
  # Runner requirements: qemu-system-arm, mtools, python3 - see
  # tests/qemu-boot/README.md.
  qemu-boot-test:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: 32bit
            dist: dist
          - preset: 64bit
            dist: dist64
    name: qemu-boot-test (${{ matrix.preset }})

    steps:
      # Scripts only - no submodules, no build tree
      - uses: actions/checkout@v6

      # qemu-system-arm also provides qemu-system-aarch64 on Ubuntu.
      - name: Install QEMU boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm mtools python3
          qemu-system-arm --version | head -n1

      - name: Download boot-test input
        uses: actions/download-artifact@v7
        with:
          name: qemu-boot-input-${{ matrix.preset }}
          path: qemu-input

      - name: Run QEMU first-boot test (${{ matrix.preset }})
        run: ./tests/qemu-boot/run-boot-test.sh --preset ${{ matrix.preset }} --dist qemu-input/${{ matrix.dist }} --buildinfo qemu-input/buildinfo.json --out qemu-boot-out

      - name: Upload QEMU boot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-boot-logs-${{ matrix.preset }}
          path: |
            qemu-boot-out/*.log
            qemu-boot-out/*.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    # Publishes only after both boot tests pass. Skipped (shown grey, not
    # red) on branches other than main. needs build for the filename output.
    if: github.ref == 'refs/heads/main'
    needs: [build, assemble, qemu-boot-test]
    runs-on: ubuntu-26.04

    steps:
      - name: Download release file bundle
        uses: actions/download-artifact@v7
        with:
          name: release-files
          path: release-files

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: USBODE build-${{ github.run_number }}
          files: |
            release-files/${{ needs.build.outputs.filename }}.zip
            release-files/${{ needs.build.outputs.filename }}-64bit.zip
            release-files/imgout/${{ needs.build.outputs.filename }}.img.xz
            release-files/imgout/${{ needs.build.outputs.filename }}-64bit.img.xz
            release-files/upgrade/sysupgrade32.tar
            release-files/upgrade/sysupgrade32.crc
            release-files/upgrade/sysupgrade64.tar
            release-files/upgrade/sysupgrade64.crc
            release-files/buildinfo.json
            release-files/imgout/os-sublist.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
